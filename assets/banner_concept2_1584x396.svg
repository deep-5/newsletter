      <rect x="0" y="0" width="460" height="56" rx="28" fill="#D2FF52" />
      <text x="28" y="34" font-family="'Poppins', 'Inter', sans-serif" font-size="15" font-weight="800" fill="#131313">🚀 50+ n8n Workflows &amp; 1K Prompts</text>
