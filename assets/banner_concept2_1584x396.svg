    <!-- Pill 4: Micro Tagline -->
    <g transform="translate(20, 210)">
      <text x="0" y="16" font-family="'Poppins', 'Inter', sans-serif" font-size="12" font-weight="500" fill="#FFFFFF" fill-opacity="0.9">
