      <text x="14" y="22" font-family="'Poppins', 'Inter', sans-serif" font-size="13" font-weight="700" fill="#D2FF52">⚡ aira.today</text>
    </g>
  </g>

  <!-- RIGHT NEON PILL STACK (Inside Blue Wave) -->
  <g transform="translate(1030, 65)">
