<?xml version="1.0" encoding="UTF-8"?>
<svg width="1584" height="396" viewBox="0 0 1584 396" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="c2_wave" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C46F5" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0E2AA8" stop-opacity="0.95" />
