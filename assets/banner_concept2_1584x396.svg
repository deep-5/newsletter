    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="460" height="56" rx="28" fill="#D2FF52" />
      <text x="28" y="34" font-family="'Poppins', 'Inter', sans-serif" font-size="15" font-weight="800" fill="#131313">⚡ 4-Min Daily Briefs</text>
      <text x="270" y="34" font-family="'Poppins', 'Inter', sans-serif" font-size="12" font-weight="600" fill="#131313">Zero-Fluff News →</text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(0, 70)">
      <rect x="0" y="0" width="460" height="56" rx="28" fill="#D2FF52" />
      <text x="28" y="34" font-family="'Poppins', 'Inter', sans-serif" font-size="15" font-weight="800" fill="#131313">🛠️ 100+ Verified AI Tools</text>
      <text x="270" y="34" font-family="'Poppins', 'Inter', sans-serif" font-size="12" font-weight="600" fill="#131313">Open-Source Alts →</text>
