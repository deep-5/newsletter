  </defs>

  <!-- Background #131313 -->
  <rect width="1584" height="396" fill="#131313" />

  <!-- Right Geometric Wave Section in Royal Cobalt #1C46F5 -->
  <path d="M 980 0 C 900 120, 860 260, 940 396 L 1584 396 L 1584 0 Z" fill="url(#c2_wave)" />
  <path d="M 976 0 C 896 120, 856 260, 936 396" stroke="#D2FF52" stroke-width="3.5" fill="none" />

  <!-- LEFT BRANDING -->
  <g transform="translate(100, 95)">
