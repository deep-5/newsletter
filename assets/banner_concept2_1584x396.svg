    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="145" height="26" rx="13" fill="#1B1B1F" stroke="#2E2E35" stroke-width="1" />
      <circle cx="13" cy="13" r="4" fill="#D2FF52" />
      <text x="26" y="17" font-family="'Poppins', 'Inter', sans-serif" font-size="10.5" font-weight="700" fill="#D2FF52" letter-spacing="1">AIRA MEDIA</text>
    </g>

    <!-- Main Title -->
    <g transform="translate(0, 42)">
      <text x="0" y="44" font-family="'Poppins', 'Inter', sans-serif" font-size="56" font-weight="900" fill="#F7F7F7" letter-spacing="-0.03em">AIRA<tspan fill="#D2FF52">.</tspan></text>
      <text x="0" y="86" font-family="'Poppins', 'Inter', sans-serif" font-size="20" font-weight="600" fill="#F7F7F7">
        Frontier AI Intelligence &amp; Production Workflows
      </text>
      <text x="0" y="114" font-family="'Poppins', 'Inter', sans-serif" font-size="13.5" font-weight="400" fill="#9E9EA8">
