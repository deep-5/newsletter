<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E0B36"/>
      <stop offset="35%" stop-color="#4C1D95"/>
      <stop offset="70%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>

    <!-- Accent Glow -->
    <radialGradient id="glowPurple" cx="20%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#1E0B36" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowOrange" cx="85%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#FB923C" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#EA580C" stop-opacity="0"/>
    </radialGradient>

    <!-- Icon Background Gradient -->
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>

    <!-- Card Glass Border -->
    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Button Gradient -->
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#16A34A"/>
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="400" rx="20" fill="url(#bgGrad)"/>
  <rect width="1200" height="400" rx="20" fill="url(#glowPurple)"/>
  <rect width="1200" height="400" rx="20" fill="url(#glowOrange)"/>
  <rect width="1200" height="400" rx="20" fill="none" stroke="url(#glassBorder)" stroke-width="2"/>

  <!-- Geometric Grid Accent Lines -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="800" y1="0" x2="800" y2="400"/>
    <line x1="1000" y1="0" x2="1000" y2="400"/>
  </g>

  <!-- Left Icon Container -->
  <g transform="translate(60, 60)" filter="url(#shadow)">
    <!-- Icon Box -->
    <rect width="280" height="280" rx="36" fill="url(#iconGrad)"/>
    <rect width="280" height="280" rx="36" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="3"/>
    
    <!-- UI Letters -->
    <text x="75" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="110" font-weight="900" fill="#FFFFFF" letter-spacing="-2">UI</text>
    <text x="45" y="225" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">Designer</text>
  </g>

  <!-- Content Right Side -->
  <g transform="translate(380, 65)">
    <!-- Top Pill Badge -->
    <g>
      <rect width="280" height="34" rx="17" fill="#D2FF52"/>
      <text x="16" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#131313" letter-spacing="0.8">⚡ DESIGN COMMUNITY • 20+ HR</text>
    </g>

    <!-- Main Headline -->
    <text x="0" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">
      Join our UI/UX Design Community
    </text>

    <!-- Description Paragraph -->
    <text x="0" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500" fill="rgba(255,255,255,0.9)" width="740">
      <tspan x="0" dy="0">A space where designers share ideas, trends, and practical tips.</tspan>
      <tspan x="0" dy="30">Learn something new, improve design skills, and connect with creatives. 20+ HR</tspan>
    </text>

    <!-- Features / Stats Bar -->
    <g transform="translate(0, 215)">
      <!-- Job Posting Badge -->
      <rect width="140" height="42" rx="10" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
      <text x="18" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">💼 20+ HR</text>

      <!-- Trends Badge -->
      <rect x="195" width="180" height="42" rx="10" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
      <text x="210" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">💡 Practical Tips</text>

      <!-- CTA Button -->
      <g transform="translate(410, -3)" filter="url(#shadow)">
        <rect width="290" height="48" rx="12" fill="#FFFFFF"/>
        <text x="35" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#7C3AED">Join the Community ↗</text>
      </g>
    </g>
  </g>
</svg>
