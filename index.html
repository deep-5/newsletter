<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AIRA | The One and Only AI Newsletter</title>
  
  <meta name="description" content="The one and only AI newsletter. Join us and get the best AI news, tools, and tutorials completely FREE!" />
  <meta name="keywords" content="machine learning, artificial intelligence, technology, AI newsletter, AIRA" />
  <meta name="author" content="AIRA" />

  <!-- Open Graph / Meta -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="AIRA | The One and Only AI Newsletter" />
  <meta property="og:description" content="The one and only AI newsletter. Join us and get the best AI news, tools, and tutorials completely FREE!" />
  <meta property="og:site_name" content="AIRA" />
  <meta property="og:image" content="assets/logo.jpg" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="AIRA | The One and Only AI Newsletter" />

  <meta name="twitter:image" content="assets/logo.jpg" />

  <!-- Favicon -->
  <link rel="icon" type="image/jpeg" href="assets/logo.jpg" />

  <!-- Stylesheet -->
  <link rel="stylesheet" href="styles.css?v=2.6" />

<body>

  <!-- Sticky Navbar Header -->
  <header class="site-header">
    <div class="container nav-wrapper">
      <!-- Brand Link -->
      <a href="#/" class="brand-link">
        <img src="assets/logo.jpg" alt="AIRA Logo" class="brand-logo-img" onerror="this.src='assets/logo.svg'" />
        <span class="brand-title">AIRA</span>
      </a>

      <!-- Center Nav Links -->
      <ul class="nav-center-links">
        <li><a href="#/" class="nav-link" data-nav="home">Home</a></li>
        <li><a href="#/archive" class="nav-link" data-nav="archive">Archive</a></li>
        <li><a href="#/tags" class="nav-link" data-nav="tags">Tags</a></li>
      </ul>

      <!-- Right Actions -->
      <div class="nav-right-actions">
        <button class="search-trigger-btn" id="btn-search-trigger" title="Search articles">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <span>Search</span>
          <span class="search-kbd">⌘K</span>
        </button>
        <button class="btn-subscribe-nav" id="btn-subscribe-header">Subscribe</button>
      </div>
    </div>
  </header>

  <!-- Main Content Container (Controlled by Router) -->
  <main id="app-content"></main>

          <span class="footer-brand-title">AIRA</span>
        </div>
        <p class="footer-brand-desc">
          The one and only AI newsletter. Join us and get the best AI news, tools, and tutorials completely FREE!
        </p>
        <p class="footer-copyright">
          © 2026 AIRA. All rights reserved.
        </p>
      </div>

      <!-- Subscription Column -->
      <div class="footer-subscribe-col">
        <form class="footer-sub-form" id="footer-sub-form">
          <input type="email" class="footer-sub-input" placeholder="Email" required />
          <button type="submit" class="footer-sub-btn">Subscribe</button>

  <!-- Search Modal -->
  <div class="modal-overlay" id="search-modal">
    <div class="modal-card search-modal-card">
      <button class="modal-close-btn" aria-label="Close search">✕</button>
      <div class="search-input-header">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" id="search-input" class="search-modal-input" placeholder="Search newsletter posts..." autocomplete="off" />
      </div>
      <div class="search-results-list" id="search-results"></div>
    </div>
  </div>

  <!-- Subscribe Modal -->
  <div class="modal-overlay" id="subscribe-modal">
    <div class="modal-card" style="text-align: center;">
      <button class="modal-close-btn" aria-label="Close">✕</button>
      <img src="assets/logo.jpg" alt="AIRA" style="width: 56px; height: 56px; border-radius: 12px; margin: 0 auto 16px auto;" onerror="this.src='assets/logo.svg'" />
      <h3 style="font-family: var(--font-header); font-size: 1.6rem; font-weight: 800; margin-bottom: 8px;">Join AIRA</h3>
      <p style="color: var(--color-text-secondary); font-size: 0.95rem; margin-bottom: 24px;">The one and only AI newsletter. Join 50,000+ AI builders and leaders.</p>
      
      <form id="modal-sub-form" style="display: flex; flex-direction: column; gap: 12px;">
        <input type="email" placeholder="Enter your email address" required style="padding: 12px 16px; border: 1px solid var(--color-border); border-radius: var(--radius-sm); font-size: 1rem;" />
        <button type="submit" style="background: #18181B; color: #FFFFFF; font-weight: 600; padding: 12px; border-radius: var(--radius-sm); cursor: pointer; font-size: 1rem;">Subscribe Free</button>
      </form>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toast-container"></div>

  <!-- Supabase CDN Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>

  <!-- Data and Application Script -->
  <script src="data/articles.js?v=2.6"></script>
  <script src="app.js?v=2.6"></script>
</body>
</html>
